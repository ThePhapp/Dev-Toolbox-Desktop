[package]
name = "dev-toolbox-desktop"
version = "0.1.0"
description = "Fast, private, offline developer utilities"
authors = ["Dev Toolbox contributors"]
edition = "2021"

[lib]
name = "dev_toolbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
